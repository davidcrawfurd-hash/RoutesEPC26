<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Europa Power Conference 2026 — Routes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      background: #f4f7f7;
    }

    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.96);
      padding: 12px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,.18);
      max-width: 440px;
      backdrop-filter: blur(4px);
    }

    #controls h1 {
      font-size: 16px;
      margin: 0 0 10px;
      color: #183a35;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .row select {
      flex: 1;
      padding: 9px 10px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #c8d4d1;
      background: #fff;
      color: #1d2c2b;
    }

    .row button {
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      background: #0a7c55;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      min-width: 46px;
    }

    .row button:hover {
      background: #086042;
    }

    .modes {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .modes button {
      flex: 1;
      min-width: 92px;
      padding: 8px 7px;
      border: 1px solid #c6d1ce;
      border-radius: 8px;
      background: #eef5f4;
      cursor: pointer;
      font-size: 13px;
      color: #1d2c2b;
    }

    .modes button.active {
      background: #0a7c55;
      color: #fff;
      border-color: #0a7c55;
    }

    #info {
      font-size: 13px;
      color: #243b39;
      min-height: 18px;
      background: #edf8f3;
      border: 1px solid #d7eae1;
      padding: 8px 10px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
      max-height: 150px;
      overflow-y: auto;
    }

    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      border-radius: 10px;
    }

    .loading {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="controls">
    <h1>Europa Power Conference 2026 — Routes</h1>

    <div class="row">
      <select id="from"><option value="">From…</option></select>
      <button id="swap" title="Swap">⇄</button>
    </div>

    <div class="row">
      <select id="to"><option value="">To…</option></select>
      <button id="go">Go</button>
    </div>

    <div class="modes">
      <button class="mode active" data-mode="foot-walking">🚶 Walk</button>
      <button class="mode" data-mode="cycling-regular">🚲 Bike</button>
      <button class="mode" data-mode="driving-car">🚗 Drive</button>
      <button class="mode" data-mode="transit">🚆 Transit</button>
    </div>

    <div id="info"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const ORS_API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImI2OTZjM2U2YTE5ZDQ3YTNhMmYyZjU5MWNlZmNkMjlkIiwiaCI6Im11cm11cjY0In0=";

    const POINTS = [
      { name: "Train Station (Gare de Strasbourg)", lat: 48.5851, lon: 7.7346 },
      { name: "AC Marriott Strasbourg", lat: 48.5836, lon: 7.7480 },
      { name: "BOMA Hostel", lat: 48.5810, lon: 7.7405 },
      { name: "Hilton Strasbourg", lat: 48.5812, lon: 7.7480 },
      { name: "IBIS Petite France", lat: 48.5796, lon: 7.7412 },
      { name: "IBIS Styles Nord Palais des Congrès", lat: 48.5960, lon: 7.7390 },
      { name: "Le Grand Hôtel", lat: 48.5838, lon: 7.7450 },
      { name: "Hôtel de Région Grand Est", lat: 48.5860, lon: 7.7520 },
      { name: "Hôtel de Ville", lat: 48.5840, lon: 7.7490 },
      { name: "Palais de la Musique et des Congrès", lat: 48.5960, lon: 7.7380 },
      { name: "Parlement Européen", lat: 48.5970, lon: 7.7690 }
    ];

    const map = L.map('map').setView([48.586, 7.74], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const byName = {};
    const markers = {};
    POINTS.forEach(p => {
      byName[p.name] = p;
      const marker = L.marker([p.lat, p.lon]).addTo(map);
      marker.bindPopup(`<b>${p.name}</b>`);
      markers[p.name] = marker;
    });

    const fromSel = document.getElementById('from');
    const toSel = document.getElementById('to');
    const info = document.getElementById('info');

    POINTS.forEach(p => {
      fromSel.add(new Option(p.name, p.name));
      toSel.add(new Option(p.name, p.name));
    });

    let currentRoute = null;
    let mode = 'foot-walking';

    document.querySelectorAll('.mode').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        if (fromSel.value && toSel.value) route(fromSel.value, toSel.value);
      });
    });

    document.getElementById('swap').addEventListener('click', () => {
      const f = fromSel.value;
      const t = toSel.value;
      fromSel.value = t;
      toSel.value = f;
      if (fromSel.value && toSel.value) route(fromSel.value, toSel.value);
    });

    document.getElementById('go').addEventListener('click', () => {
      if (fromSel.value && toSel.value) route(fromSel.value, toSel.value);
    });

    function clearRoute() {
      if (currentRoute) {
        map.removeLayer(currentRoute);
        currentRoute = null;
      }
    }

    function modeToORSProfile(m) {
      const profiles = {
        'foot-walking': 'foot-walking',
        'cycling-regular': 'cycling-regular',
        'driving-car': 'driving-car',
        'transit': 'public-transport'
      };
      return profiles[m] || 'foot-walking';
    }

    function route(fromName, toName) {
      const a = byName[fromName];
      const b = byName[toName];
      if (!a || !b) return;

      clearRoute();

      const profile = modeToORSProfile(mode);
      const coordinates = [[a.lon, a.lat], [b.lon, b.lat]];

      info.style.display = 'block';
      info.innerHTML = '<span class="loading">⏳</span> Finding route...';

      const requestBody = {
        coordinates: coordinates,
        radiuses: [-1, -1]
      };

      if (mode === 'transit') {
        requestBody.schedule = true;
      }

      fetch(`https://api.openrouteservice.org/v2/directions/${profile}/json`, {
        method: 'POST',
        headers: {
          'Authorization': ORS_API_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(requestBody)
      })
      .then(res => res.json())
      .then(data => {
        if (data.error) {
          info.innerHTML = `<b>${fromName}</b> → <b>${toName}</b><br>Error: ${data.error.message || 'Unable to find route'}`;
          return;
        }

        if (!data.routes || data.routes.length === 0) {
          info.innerHTML = `<b>${fromName}</b> → <b>${toName}</b><br>No route found.`;
          return;
        }

        const route = data.routes[0];
        const summary = route.summary;
        const geometry = route.geometry;

        // Draw route on map
        const coords = geometry.coordinates || [];
        if (coords.length > 0) {
          const latlngs = coords.map(c => [c[1], c[0]]);
          currentRoute = L.polyline(latlngs, {
            color: mode === 'transit' ? '#1a73e8' : '#0a7c55',
            weight: 5,
            opacity: 0.8,
            dashArray: mode === 'transit' ? '10 12' : ''
          }).addTo(map);

          map.fitBounds(currentRoute.getBounds(), { padding: [50, 50] });
        }

        // Format info
        const km = (summary.distance / 1000).toFixed(1);
        const min = Math.round(summary.duration / 60);
        const modeLabel = mode === 'foot-walking' ? 'walking' :
                          mode === 'cycling-regular' ? 'cycling' :
                          mode === 'driving-car' ? 'driving' : 'public transport';

        let infoText = `<b>${fromName}</b> → <b>${toName}</b><br>
                        ${km} km · ~${min} min (${modeLabel})`;

        // If transit, show detailed steps
        if (mode === 'transit' && route.segments && route.segments.length > 0) {
          infoText += '<br><br><strong>Steps:</strong>';
          route.segments.forEach((seg, idx) => {
            if (seg.steps && seg.steps.length > 0) {
              const step = seg.steps[0];
              const type = step.type || 'walking';
              const instructions = step.instruction || type;
              infoText += `<br>${idx + 1}. ${instructions}`;
            }
          });
        }

        info.innerHTML = infoText;
      })
      .catch(err => {
        info.innerHTML = `<b>${fromName}</b> → <b>${toName}</b><br>Error: ${err.message}`;
      });
    }
  </script>
</body>
</html>
